[package]
name = "darknet-cuda-cutile"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
darknet-cuda = { path = "../../crates/darknet-cuda" }
cutile = { path = "../cutile-rs-aot/cutile" }
cutile-compiler = { path = "../cutile-rs-aot/cutile-compiler" }
linkme = "0.3"

[build-dependencies]
cutile = { path = "../cutile-rs-aot/cutile" }
cutile-compiler = { path = "../cutile-rs-aot/cutile-compiler" }

[lib]
name = "darknet_cuda_cutile"
path = "src/lib.rs"

# Keep this CUDA bridge independent from the parent CPU workspace.  The local
# cuTile fork is itself a workspace and uses its own workspace-inherited
# package metadata.
[workspace]
