[package]
name = "ptx-schedule"
version = "0.1.0"
edition.workspace = true
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"
repository = "https://github.com/NVlabs/cuda-oxide.git"
description = "Structural PTX schedule analysis and deterministic perturbation"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialect-ptx = { workspace = true }
oxide-artifacts = { workspace = true, features = ["object-read"] }
ptx-parse = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
