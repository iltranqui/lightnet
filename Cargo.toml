[workspace]
resolver = "3"
exclude = [
    "src/darknet-cuda-cutile",
    "src/darknet-cuda-oxide",
    "bridges/rustc-codegen-cuda",
]
members = [
    # Darknet Rust port
    "src/darknet-cli",
    "src/darknet-core",
    "src/darknet-cuda",
    "src/darknet-examples",
    # "src/darknet-gui", "src/darknet-gui-engine", "src/darknet-gui-project":
    # referenced by WIP 8fb5bb1b but absent from the tree; re-add when restored.

    # cuda-oxide (vendored from NVlabs/cuda-oxide, Apache-2.0)
    # Core crates
    "bridges/cuda-target-spec",
    "bridges/cuda-intrinsics",
    "bridges/cuda-intrinsics-gen",
    "bridges/ptx-parse",
    "bridges/ptx-schedule",
    "bridges/dialect-ptx",
    "bridges/cuda-device",
    "bridges/cuda-artifact-finalizer",
    "bridges/cuda-host",
    "bridges/cuda-macros",
    "bridges/llvm-export",
    "bridges/dialect-mir",
    "bridges/dialect-iket",
    "bridges/dialect-nvvm",
    "bridges/mir-importer",
    "bridges/cuda-oxide-codegen",
    "bridges/mir-lower",
    "bridges/iket-lower",
    "bridges/mir-transforms",
    "bridges/nvvm-transforms",
    "bridges/cargo-oxide",
    "bridges/oxide-artifacts",
    # FFI bindings
    # cuda-bindings, cuda-core, and cuda-async are the host-side crates shared
    # with cutile-rs and published from NVlabs/cutile-rs; the cuda-oxide SIMT
    # surface lives under their `simt` modules. The local copies are gone.
    "bridges/libnvvm-sys",
    "bridges/nvjitlink-sys",
    # Internal naming contract (workspace-private; publish = false)
    "bridges/reserved-oxide-symbols",
    # Differential codegen fuzzer support
    "bridges/fuzzer",
]
# Plain `cargo check/test` skips the heavy iced/wgpu GUI; build it with `-p darknet-gui`.
default-members = [
    "src/darknet-cli",
    "src/darknet-core",
    "src/darknet-cuda",
    "src/darknet-examples",
    "bridges/cuda-target-spec",
    "bridges/cuda-intrinsics",
    "bridges/cuda-intrinsics-gen",
    "bridges/ptx-parse",
    "bridges/ptx-schedule",
    "bridges/dialect-ptx",
    "bridges/cuda-device",
    "bridges/cuda-artifact-finalizer",
    "bridges/cuda-host",
    "bridges/cuda-macros",
    "bridges/llvm-export",
    "bridges/dialect-mir",
    "bridges/dialect-iket",
    "bridges/dialect-nvvm",
    "bridges/mir-importer",
    "bridges/cuda-oxide-codegen",
    "bridges/mir-lower",
    "bridges/iket-lower",
    "bridges/mir-transforms",
    "bridges/nvvm-transforms",
    "bridges/cargo-oxide",
    "bridges/oxide-artifacts",
    "bridges/libnvvm-sys",
    "bridges/nvjitlink-sys",
    "bridges/reserved-oxide-symbols",
    "bridges/fuzzer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"  # darknet crates; vendored cuda-oxide crates set Apache-2.0 explicitly

# Note: bridges/rustc-codegen-cuda is NOT a workspace member because it requires
# special rustc nightly features and a different build process.
# Build and run examples with: cargo oxide run <example>
# Examples are in: bridges/rustc-codegen-cuda/examples/

[workspace.dependencies]
# Pliron MLIR framework, pinned to upstream struct-layout, GEP no-wrap, volatile,
# global-constant, inline-asm, and generic LLVM attribute semantics.
# pliron-llvm uses default-features = false to keep llvm-sys (LLVM 23) out:
# cuda-oxide consumes the dialect modeling only, not the FFI bridge.
# `bridges/rustc-codegen-cuda/Cargo.toml` MUST stay on this same rev, or pliron
# resolves to two distinct crates and types stop unifying.
pliron = { git = "https://github.com/pliron-org/pliron", rev = "06d99a3df938394583715aacf5eadb65b4791c09" }
pliron-derive = { git = "https://github.com/pliron-org/pliron", rev = "06d99a3df938394583715aacf5eadb65b4791c09" }
pliron-llvm = { git = "https://github.com/pliron-org/pliron", rev = "06d99a3df938394583715aacf5eadb65b4791c09", default-features = false, features = [
    "std",
] }

# Internal crates
cuda-target-spec = { path = "bridges/cuda-target-spec" }
llvm-export = { path = "bridges/llvm-export" }
dialect-mir = { path = "bridges/dialect-mir" }
dialect-iket = { path = "bridges/dialect-iket" }
dialect-ptx = { path = "bridges/dialect-ptx" }
dialect-nvvm = { path = "bridges/dialect-nvvm" }
mir-lower = { path = "bridges/mir-lower" }
iket-lower = { path = "bridges/iket-lower" }
mir-importer = { path = "bridges/mir-importer" }
cuda-oxide-codegen = { path = "bridges/cuda-oxide-codegen" }
mir-transforms = { path = "bridges/mir-transforms" }
nvvm-transforms = { path = "bridges/nvvm-transforms" }
cuda-device = { path = "bridges/cuda-device" }
cuda-artifact-finalizer = { path = "bridges/cuda-artifact-finalizer" }
cuda-host = { path = "bridges/cuda-host" }
# No default features: `host` is opt-in per member, so that depending on
# cuda-device does not unify the host surface back on for kernel-only crates.
# `cuda-host` names `features = ["host"]`, so anything that loads or launches a
# module still gets it.
cuda-macros = { path = "bridges/cuda-macros", default-features = false }
cuda-bindings = "0.3.1"
cuda-core = "0.3.1"
cuda-async = "0.3.1"
libnvvm-sys = { path = "bridges/libnvvm-sys" }
nvjitlink-sys = { path = "bridges/nvjitlink-sys" }
reserved-oxide-symbols = { path = "bridges/reserved-oxide-symbols" }
fuzzer = { path = "bridges/fuzzer" }
# The crates.io release, not the in-tree path: the shared cuda-core (cutile-rs)
# reads artifact bundles through crates.io oxide-artifacts, and a path copy of
# the same version is a second crate to rustc. bridges/oxide-artifacts stays in
# the workspace as the source this release is published from; bump, publish,
# then move this line. scripts/check-oxide-artifacts-parity.sh keeps them equal.
oxide-artifacts = "0.2.1"
ptx-parse = { path = "bridges/ptx-parse" }
ptx-schedule = { path = "bridges/ptx-schedule" }

# Common dependencies
futures = "0.3"
thiserror = "2"
linkme = "0.3"
anyhow = "1.0"
once_cell = "1.18"
combine = "4.6"
log = "0.4"
half = "2.7"
libloading = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3.9"
rustc-demangle = "0.1"

# llvm-export deps
rustc-hash = "2.0"
bitflags = "2.0"
dyn-clone = "1.0"

# cuda-macros deps
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

# `cargo oxide` runs through the workspace's dev-profile Cargo alias. Its
# backend fingerprint hashes a large debug shared object on every invocation;
# optimize only SHA-256 so exact content fingerprinting remains inexpensive.
[profile.dev.package.sha2]
opt-level = 3

# The oxide bridge needs MIR const-propagation (opt-level >= 1) for its float
# atomics; its own [profile.dev] is ignored when built as a dependency.
[profile.dev.package.darknet-cuda-oxide]
opt-level = 1
