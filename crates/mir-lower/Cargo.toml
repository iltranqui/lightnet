[package]
name = "mir-lower"
version = "0.2.1"
edition.workspace = true
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"
repository = "https://github.com/NVlabs/cuda-oxide.git"
description = "dialect-mir to LLVM dialect lowering pass"
readme = "README.md"

[dependencies]
rustc-hash = { workspace = true }
pliron = { workspace = true }
llvm-export = { workspace = true }
pliron-derive = { workspace = true }
thiserror = { workspace = true }
dialect-mir = { workspace = true }
dialect-nvvm = { workspace = true }
mir-transforms = { workspace = true }
anyhow = { workspace = true }
reserved-oxide-symbols = { workspace = true }

[dev-dependencies]
# Only used by unit tests to build a `combine` SourcePosition for synthetic
# pliron source locations; not needed by the crate's non-test code.
combine = { workspace = true }
