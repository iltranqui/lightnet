# ============================================================
# FPN NECK
# ============================================================

[route]
layers = -4

[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

[upsample]
stride=2

[route]
layers = -1, 23

[convolutional]
batch_normalize=1
filters=384
size=3
stride=1
pad=1
activation=swish

# ============================================================
# DETECTION HEAD 2  (small objects, stride 8)
# ============================================================

# --- HEAD 2 ACTIVE: YOLO-NAS-style  (filters = 74) ---
[convolutional]
size=1
stride=1
pad=1
filters=74
activation=linear

[yolonas]
classes=5
max=200
reg_max=16
jitter=.3
resize=1.5

