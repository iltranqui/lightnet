# YOLO-NAS-style anchor-free detection head on the LegoGears backbone.
# Same topology as LegoGears_modern_yolo.cfg (standard conv layers).
#
# Filter counts (5 classes):
#   YOLO-NAS : filters = 4*(reg_max+1)+1+classes = 74  (reg_max=16)
#   YOLOX    : filters = classes + 5                =  10
#   PP-YOLOE : same as YOLO-NAS                    =  74
#
# Active head: YOLO-NAS

[net]
# Testing
#batch=1
#subdivisions=1
# Training
batch=32
subdivisions=1
width=224
height=160
channels=3
momentum=0.92
decay=0.0005
angle=0
saturation=1.500000
exposure=1.500000
hue=0.100000
#thread_val=2
#optimizer=muon
#muon_iters=5
#muon_eps=0.000001
#muon_max_m=1024
adam=0

learning_rate=0.002610
burn_in=1000

max_batches=3000
policy=steps
steps=1400,1700
scales=0.2,0.1
loss_scale=1.0
random_init_weights=0

#weights_reject_freq=1001
#ema_alpha=0.9998
#equidistant_point=1000
#num_sigmas_reject_badlabels=3
#badlabels_rejection_percentage=0.2
cutmix=0
flip=0
max_chart_loss=4.000000
mixup=0
mosaic=0
use_cuda_graph=0
cudnn_bf16=0
cudnn_fp8=0

# ============================================================
# BACKBONE
# ============================================================

[convolutional]
batch_normalize=1
filters=32
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=swish

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=swish

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=swish

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=swish

[route]
layers = -6,-1

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=swish

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=swish

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=swish

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=swish

[route]
layers = -6,-1

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=swish

[route]
layers=-1
groups=2
group_id=1

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=swish

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=swish

[route]
layers = -1,-2

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=swish

[route]
layers = -6,-1

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=swish

# ============================================================
# DETECTION HEAD 1  (large objects, stride 16)
# ============================================================

[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

# --- HEAD 1 ACTIVE: YOLO-NAS-style  (filters = 4*(16+1)+1+5 = 74) ---
[convolutional]
size=1
stride=1
pad=1
filters=74
activation=linear

[yolonas]
classes=5
max=200
reg_max=16
jitter=.3
resize=1.5

