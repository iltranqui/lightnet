# Modern anchor-free detection heads on the LegoGears backbone.
# Same topology as LegoGears_graph.cfg but all graph_conv replaced with
# standard [convolutional] layers (edge_mode / use_self removed).
#
# Exactly ONE head variant is active per detection scale.
# To switch heads: uncomment the desired [convolutional]+[head] block,
# comment out the currently active one.
#
# Filter counts (5 classes):
#   YOLOX    : filters = classes + 5       =  10
#   PP-YOLOE : filters = 4*(reg_max+1)+1+classes = 74  (reg_max=16)
#   YOLO-NAS : same as PP-YOLOE            =  74
#
# Active head: YOLOX

[net]
# Testing
#batch=1
#subdivisions=1
# Training
batch=32
subdivisions=1
width=224
height=160
channels=3
momentum=0.92
decay=0.0005
angle=0
saturation=1.500000
exposure=1.500000
hue=0.100000
#thread_val=2
#optimizer=muon
# optional tuning (defaults shown)
#muon_iters=5
#muon_eps=0.000001
#muon_max_m=1024
# make sure Adam is off if present
adam=0

learning_rate=0.002610
burn_in=1000

max_batches=3000
policy=steps
steps=1400,1700
scales=0.2,0.1
loss_scale=1.0
random_init_weights=0


#weights_reject_freq=1001
#ema_alpha=0.9998
#equidistant_point=1000
#num_sigmas_reject_badlabels=3
#badlabels_rejection_percentage=0.2
cutmix=0
flip=0
max_chart_loss=4.000000
mixup=0
mosaic=0
use_cuda_graph=0
cudnn_bf16=0
cudnn_fp8=0

# ============================================================
# BACKBONE
# ============================================================

# --- Conv: input downsample 1/2 ---
[convolutional]
batch_normalize=1
filters=32
size=3
stride=2
pad=1
activation=leaky

# --- Conv: input downsample 2/2 ---
[convolutional]
batch_normalize=1
filters=64
size=3
stride=2
pad=1
activation=leaky

# --- Conv: 64-channel stem mixer ---
[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=swish

[route]
layers=-1
groups=2
group_id=1

# --- Conv: 32-channel CSP branch ---
[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=swish

# --- Conv: 32-channel CSP branch ---
[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=swish

[route]
layers = -1,-2

# --- Conv: 64-channel CSP fuse ---
[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=swish

[route]
layers = -6,-1

[maxpool]
size=2
stride=2

# --- Conv: 128-channel stage mixer ---
[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=swish

[route]
layers=-1
groups=2
group_id=1

# --- Conv: 128-CSP branch, block 1/2 ---
[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=swish

# --- Conv: 128-CSP branch, block 2/2 ---
[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=swish

[route]
layers = -1,-2

# --- Conv: 128-channel CSP fuse ---
[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=swish

[route]
layers = -6,-1

[maxpool]
size=2
stride=2

# --- Conv: 256-CSP stem ---
[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=swish

[route]
layers=-1
groups=2
group_id=1

# --- Conv: 128-channel CSP branch ---
[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=swish

# --- Conv: 128-channel CSP branch ---
[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=swish

[route]
layers = -1,-2

# --- Conv: 256-channel CSP fuse ---
[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=swish

[route]
layers = -6,-1

[maxpool]
size=2
stride=2

# --- Conv: 512-channel stage mixer ---
[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=swish

# ============================================================
# DETECTION HEAD 1  (large objects, stride 16)
# ============================================================

# --- Conv: detection neck projection ---
[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

# --- Conv: detection neck mixer ---
[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

# --- HEAD 1 ACTIVE: CenterNet  (filters = classes + 4 = 9) ---
[convolutional]
size=1
stride=1
pad=1
filters=9
activation=linear

[centernet]
classes=5
max=200
jitter=.3
resize=1.5
center_min_radius=1
anisotropic_gaussian=1
small_ref_size=32
small_threshold=8
small_boost=8.0
scale_min_px=12
scale_max_px=999999
gaussian_iou=0.5
focal_alpha=2.0
focal_beta=4.0
hm_normalizer=1.0
wh_normalizer=0.10
off_normalizer=1.0
max_delta=10
peak_nms=1

# --- HEAD 1 INACTIVE: PP-YOLOE  (filters = 4*(16+1)+1+5 = 74) ---
#[convolutional]
#size=1
#stride=1
#pad=1
#filters=74
#activation=linear
#
#[ppyoloe]
#classes=5
#max=200
#reg_max=16

# --- HEAD 1 INACTIVE: YOLO-NAS-style  (filters = 74) ---
#[convolutional]
#size=1
#stride=1
#pad=1
#filters=74
#activation=linear
#
#[yolonas]
#classes=5
#max=200
#reg_max=16

# ============================================================
# FPN NECK  (route back to before detection-neck projection)
# ============================================================

[route]
layers = -4

# --- Conv: FPN 1x1 projection ---
[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

[upsample]
stride=2

[route]
layers = -1, 23

# --- Conv: FPN neck detection conv ---
[convolutional]
batch_normalize=1
filters=384
size=3
stride=1
pad=1
activation=swish

# ============================================================
# DETECTION HEAD 2  (small objects, stride 8)
# ============================================================

# --- HEAD 2 ACTIVE: CenterNet small-object head  (filters = classes + 4 = 9) ---
[convolutional]
size=1
stride=1
pad=1
filters=9
activation=linear

[centernet]
classes=5
max=200
jitter=.3
resize=1.5
center_min_radius=2
anisotropic_gaussian=1
small_ref_size=32
small_threshold=8
small_boost=8.0
scale_min_px=0
scale_max_px=32
gaussian_iou=0.5
focal_alpha=2.0
focal_beta=4.0
hm_normalizer=1.0
wh_normalizer=0.10
off_normalizer=1.0
max_delta=10
peak_nms=1

