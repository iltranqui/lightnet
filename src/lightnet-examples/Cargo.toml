[package]
name = "lightnet-examples"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
llm = ["dep:lightnet-lm", "dep:sha2"]

[dependencies]
lightnet-core = { path = "../lightnet-core" }
lightnet-lm = { path = "../lightnet-lm", optional = true }
sha2 = { version = "0.10", optional = true }
image = "0.25.10"
imageproc = "0.26.1"
serde_json = "1.0"

[[example]]
name = "llm_prepare_corpus"
path = "examples/llm_prepare_corpus.rs"
required-features = ["llm"]
