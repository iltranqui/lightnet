[package]
name = "darknet-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Darknet annotation GUI: draw detection boxes and save YOLO labels"

[dependencies]
darknet-gui-project = { path = "../darknet-gui-project" }
darknet-gui-engine = { path = "../darknet-gui-engine" }
eframe = { version = "=0.32.3", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.26.1"
regex = "1"
serde.workspace = true
serde_json.workspace = true
