[package]
name = "darknet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
darknet-core = { path = "../darknet-core" }
darknet-cuda = { path = "../darknet-cuda" }
rayon = "1"
# cuda-oxide backend: optional, only compiles through `cargo oxide`
# (rustc-codegen-cuda). Build with:
#   target/debug/cargo-oxide oxide build -- -p darknet-cli --features oxide -j 1
darknet-cuda-oxide = { path = "../darknet-cuda-oxide", optional = true }

[features]
default = []
oxide = ["dep:darknet-cuda-oxide"]

[[bin]]
name = "darknet-rs"
path = "src/main.rs"
