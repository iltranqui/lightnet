[package]
name = "darknet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
darknet-core = { path = "../darknet-core" }
darknet-cuda = { path = "../darknet-cuda" }
darknet-cuda-cutile = { path = "../../bridges/darknet-cuda-cutile", optional = true }

[features]
default = []
cutile = ["dep:darknet-cuda-cutile"]

[[bin]]
name = "darknet-rs"
path = "src/main.rs"
